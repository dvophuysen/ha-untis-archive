name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Pushes aus den Claude-Sitzungen lösen keine Workflows aus; so lassen
  # sich die Tests von Hand starten.
  workflow_dispatch:

jobs:
  backend:
    name: Backend-Tests
    runs-on: ubuntu-latest
    env:
      # config.load() legt das Datenverzeichnis beim Import an; /data gehört
      # dem Runner nicht.
      WEBAPP_DATA_DIR: ${{ github.workspace }}/.ci-data
      WEBAPP_HISTORY_DB: ${{ github.workspace }}/.ci-data/history.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schul_cockpit/backend/requirements.txt
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r schul_cockpit/backend/requirements.txt pytest pytest-asyncio
      - name: Tests
        run: python -m pytest -q tests

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schul_cockpit/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: schul_cockpit/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit-Tests
        run: node --test src/lib/*.test.js
      - run: npm run build
      - name: Browser-Tests
        # Die Tests in tests/*_browser.cjs laufen gegen den gebauten Stand mit
        # künstlichen API-Antworten; playwright-core bringt den Browser mit.
        working-directory: .
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/pw/node_modules"
          for f in tests/*_browser.cjs; do echo "== $f"; node "$f"; done

  component:
    name: HA-Komponente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        # Fest auf die zuletzt lokal geprüfte Version (bringt Home Assistant
        # 2026.2.3 mit); neuere verlangen teils ein neueres Python.
        run: pip install pytest-homeassistant-custom-component==0.13.316
      - name: Tests
        run: python -m pytest -q tests_ha -c tests_ha/pytest.ini
