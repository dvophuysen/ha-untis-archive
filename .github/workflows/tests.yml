name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Pushes aus den Claude-Sitzungen lösen keine Workflows aus; so lassen
  # sich die Tests von Hand starten.
  workflow_dispatch:

jobs:
  backend:
    name: Backend-Tests
    runs-on: ubuntu-latest
    env:
      # config.load() legt das Datenverzeichnis beim Import an; /data gehört
      # dem Runner nicht.
      WEBAPP_DATA_DIR: ${{ github.workspace }}/.ci-data
      WEBAPP_HISTORY_DB: ${{ github.workspace }}/.ci-data/history.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: schul_cockpit/backend/requirements.txt
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r schul_cockpit/backend/requirements.txt pytest pytest-asyncio
      - name: Tests
        run: python -m pytest -q tests

  frontend:
    name: Frontend-Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schul_cockpit/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: schul_cockpit/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  component:
    name: HA-Komponente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Abhängigkeiten
        run: pip install pytest-homeassistant-custom-component
      - name: Tests
        run: python -m pytest -q tests_ha -c tests_ha/pytest.ini
