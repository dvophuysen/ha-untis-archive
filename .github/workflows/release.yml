name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/version (e.g. v0.2.2). If empty, read from manifest.'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'custom_components/untis_archive/manifest.json'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        # Eingaben nur über env: in die Shell, nie als Ausdruck direkt in den
        # Skripttext (sonst würde eine Eingabe wie "v1; rm -rf ." ausgeführt).
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="v$(jq -r .version custom_components/untis_archive/manifest.json)"
          fi
          if ! printf '%s' "$V" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "Ungültige Version: $V" >&2
            exit 1
          fi
          echo "tag=${V}" >> "$GITHUB_OUTPUT"
          echo "Releasing as ${V}"

      - name: Create and push tag (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if git rev-parse "$T" >/dev/null 2>&1; then
            echo "Tag $T already exists locally."
          elif gh api "repos/$REPO/git/ref/tags/$T" >/dev/null 2>&1; then
            echo "Tag $T already exists on remote."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$T" -m "Release $T"
            git push origin "$T"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          T: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "$T" >/dev/null 2>&1; then
            echo "Release $T already exists."
          else
            gh release create "$T" \
              --title "$T" \
              --target main \
              --generate-notes
          fi
