name: Schul-Cockpit
version: "1.14.4"
slug: schul_cockpit
description: Mobile Schul-App für Kinder und Eltern, basierend auf dem UNTIS-Archive-Datenbestand.
url: https://github.com/dvophuysen/ha-untis-archive/tree/main/schul_cockpit
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: false
panel_icon: mdi:school
panel_title: Schul-Cockpit
# Default is admin-only; flip to false so kids and the non-admin parent
# also see the entry in the HA sidebar.
panel_admin: false
hassio_api: true
# Backups auflisten und das eigene Add-on nächtlich sichern (D56).
hassio_role: backup
homeassistant_api: true
auth_api: true
# Direct port: lets the kids open the app on its own URL (http://<ha>:8099/)
# so iOS can install it as a real PWA (full-screen, offline). Protected by
# per-child PIN login. Inside HA the app still works via Ingress (no PIN).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direkter App-Zugriff (PIN-Login) für die Installation auf dem Home-Bildschirm
map:
  # history.db der Komponente, nur lesend, am alten Pfad /config.
  - type: homeassistant_config
    read_only: true
    path: /config
options:
  log_level: info
  external_url: ""
  ki_plattformen:
    foundry_1:
      endpunkt: ""
      api_key: ""
    foundry_2:
      endpunkt: ""
      api_key: ""
  ki_modelle:
    hoch:
      modellname: "gpt-5.6-sol"
      bereitstellungsname: ""
      foundry: "1"
      preis_eingang: 0
      preis_ausgang: 0
    mittel:
      modellname: "gpt-5.6-terra"
      bereitstellungsname: ""
      foundry: "1"
      preis_eingang: 0
      preis_ausgang: 0
    niedrig:
      modellname: "gpt-5.6-luna"
      bereitstellungsname: ""
      foundry: "1"
      preis_eingang: 0
      preis_ausgang: 0
    klein:
      modellname: ""
      bereitstellungsname: ""
      foundry: "2"
      preis_eingang: 0
      preis_ausgang: 0
    transkription:
      modellname: "gpt-4o-transcribe"
      bereitstellungsname: ""
      foundry: "1"
      preis_eingang: 0
      preis_ausgang: 0
  learning_read_token: ""
  learning_read_accounts: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  # Public URL the app is reachable at from outside HA (e.g. your Cloudflare
  # hostname for port 8099). When set, the notify-summary endpoint returns
  # full clickable deep links — perfect for WhatsApp/Telegram automations.
  external_url: str?

  # KI-Plattformen an einer Stelle. Zwei Foundry-Ressourcen dürfen nebeneinander
  # stehen, damit Modelle einzeln umziehen können. Der Endpunkt ist die
  # vollständige HTTPS-Adresse einschließlich API-Pfad und API-Version; die
  # API-Art (Responses oder Chat Completions) wird am Pfad erkannt. Nur
  # serverseitig verwendet, nie an den Browser gegeben.
  ki_plattformen:
    foundry_1:
      endpunkt: str?
      api_key: password?
    foundry_2:
      endpunkt: str?
      api_key: password?
  # Die verwendeten Modelle als vier Stufen. modellname ist der Name des
  # Modells und bestimmt Preis, Log und die Kennungen gespeicherter Ergebnisse.
  # bereitstellungsname ist der Deployment-Name in der Foundry und geht in den
  # Aufruf; leer heißt, er entspricht dem Modellnamen. foundry wählt die
  # Ressource. preis_eingang und preis_ausgang sind Euro je Million Token;
  # 0 bedeutet, es gilt der hinterlegte Satz aus der Preistabelle der App.
  # Hoch bedient das Hauptgespräch, Transkription die Spracheingabe; welche
  # Stufe den Einstieg und das Abschreiben übernimmt, steht in der Elternansicht.
  ki_modelle:
    hoch: &stufe
      modellname: str?
      bereitstellungsname: str?
      foundry: list(1|2)
      preis_eingang: float?
      preis_ausgang: float?
    mittel: *stufe
    niedrig: *stufe
    klein: *stufe
    transkription: *stufe
  learning_read_token: password?
  learning_read_accounts: str?
